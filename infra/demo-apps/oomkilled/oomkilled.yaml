apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-demo
  template:
    metadata:
      labels:
        app: oom-demo
    spec:
      containers:
        - name: oom-demo
          image: polinux/stress
          command:
            - stress
          args:
            - "--vm"
            - "1"
            - "--vm-bytes"
            - "128M"
            - "--vm-hang"
            - "1"
          resources:
            limits:
              memory: "64Mi"
            requests:
              memory: "32Mi"
