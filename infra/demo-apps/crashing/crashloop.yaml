apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashing-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashing-app
  template:
    metadata:
      labels:
        app: crashing-app
    spec:
      containers:
        - name: crashing-app
          image: busybox
          command:
            - sh
            - -c
            - "echo Starting... && sleep 2 && exit 1"
