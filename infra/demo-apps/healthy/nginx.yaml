apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-nginx
  namespace: demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: healthy-nginx

  template:
    metadata:
      labels:
        app: healthy-nginx

    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: 100m
            memory: 64Mi

          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service

metadata:
  name: healthy-nginx
  namespace: demo

spec:
  selector:
    app: healthy-nginx

  ports:
  - port: 80
    targetPort: 80
